services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: homeworkbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeworkbot}
      POSTGRES_DB: homeworkbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homeworkbot -d homeworkbot']
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USE_LOCAL_DB: 'false'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: homeworkbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeworkbot}
      POSTGRES_DB: homeworkbot
      TOKEN: ${TOKEN}

volumes:
  pgdata:
